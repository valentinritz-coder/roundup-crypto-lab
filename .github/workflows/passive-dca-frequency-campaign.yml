name: Passive DCA frequency campaign
'on':
  workflow_dispatch:
    inputs:
      phase:
        description: Run exploratory windows or the isolated confirmation window
        required: true
        default: exploratory
        type: choice
        options: [exploratory, confirmation]
      start_date:
        description: Optional earliest scenario start as YYYYMMDD
        required: false
        default: ""
        type: string
      campaign_path:
        description: Frozen passive frequency campaign definition
        required: true
        default: config/passive-dca-frequency-campaign.json
        type: string
      policy_path:
        description: Frozen passive frequency classification policy
        required: true
        default: config/passive-dca-frequency-policy.json
        type: string
      artifact_name:
        description: Artifact prefix
        required: true
        default: passive-dca-frequency-campaign
        type: string

permissions:
  contents: read

concurrency:
  group: 'passive-dca-frequency-${{ inputs.phase }}'
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      shards: '${{ steps.plan.outputs.shards }}'
      scenario_count: '${{ steps.plan.outputs.scenario_count }}'
    defaults:
      run:
        shell: "bash -eo pipefail {0}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Validate committed research inputs and shard plan
        id: plan
        env:
          PHASE: '${{ inputs.phase }}'
          START_DATE: '${{ inputs.start_date }}'
          CAMPAIGN_PATH: '${{ inputs.campaign_path }}'
          POLICY_PATH: '${{ inputs.policy_path }}'
          REGISTRY_PATH: config/passive-dca-frequency-strategies.json
          COST_PROFILE_DIR: config/execution-cost-profiles
          SHARD_COUNT: '12'
        run: |
          test "$CAMPAIGN_PATH" = config/passive-dca-frequency-campaign.json
          test "$POLICY_PATH" = config/passive-dca-frequency-policy.json
          test "$PHASE" = exploratory -o "$PHASE" = confirmation
          mkdir -p prepared/shards
          python -m roundup_crypto_lab.dca_registry \
            "$REGISTRY_PATH" --output prepared/validated-frequency-registry.json
          python -m roundup_crypto_lab.passive_dca_frequency_campaign validate \
            --campaign "$CAMPAIGN_PATH" \
            --registry "$REGISTRY_PATH" \
            --policy "$POLICY_PATH" \
            --cost-profile-dir "$COST_PROFILE_DIR" \
            --output prepared/validated-campaign.json
          python -m roundup_crypto_lab.passive_dca_frequency_campaign plan \
            --campaign "$CAMPAIGN_PATH" \
            --registry "$REGISTRY_PATH" \
            --policy "$POLICY_PATH" \
            --cost-profile-dir "$COST_PROFILE_DIR" \
            --phase "$PHASE" \
            --output prepared/campaign-plan.json
          python - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path

          path = Path("prepared/campaign-plan.json")
          rows = json.loads(path.read_text(encoding="utf-8"))
          start_date = os.environ["START_DATE"].strip()
          if start_date:
              try:
                  datetime.strptime(start_date, "%Y%m%d")
              except ValueError as error:
                  raise SystemExit("start_date must use YYYYMMDD") from error
              rows = [row for row in rows if row["timerange"][:8] >= start_date]
              if not rows:
                  raise SystemExit(
                      f"no passive frequency scenarios start on or after {start_date}"
                  )
          path.write_text(
              json.dumps(rows, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          requested_shards = int(os.environ["SHARD_COUNT"])
          shard_count = min(requested_shards, len(rows))
          shards = [[] for _ in range(shard_count)]
          for index, row in enumerate(rows):
              shards[index % shard_count].append(row)
          for shard_index, shard_rows in enumerate(shards):
              Path(f"prepared/shards/{shard_index}.json").write_text(
                  json.dumps(shard_rows, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
          matrix = {"shard": list(range(shard_count))}
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(
                  f"shards={json.dumps(matrix, separators=(',', ':'))}\n"
              )
              output.write(f"scenario_count={len(rows)}\n")
          print(
              f"planned scenarios={len(rows)}; shards={shard_count}; "
              f"phase={os.environ['PHASE']}"
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: '${{ inputs.artifact_name }}-plan-${{ github.run_id }}'
          path: prepared/
          if-no-files-found: error
          retention-days: 30

  campaign:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: '${{ fromJSON(needs.prepare.outputs.shards) }}'
    defaults:
      run:
        shell: "bash -eo pipefail {0}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Restore prepared Kraken cache
        id: restore-kraken
        uses: actions/cache/restore@v4
        with:
          path: user_data/data/kraken
          key: 'kraken-ohlcv-v1-passive-frequency-${{ github.run_id }}'
          restore-keys: kraken-ohlcv-v1-
      - name: Download campaign plan
        uses: actions/download-artifact@v4
        with:
          name: '${{ inputs.artifact_name }}-plan-${{ github.run_id }}'
          path: prepared
      - name: Run passive frequency shard
        env:
          SHARD: '${{ matrix.shard }}'
          PHASE: '${{ inputs.phase }}'
        run: |
          test '${{ steps.restore-kraken.outputs.cache-hit }}' != '' || {
            echo 'No prepared Kraken cache was restored. Run Update Kraken data first.'
            exit 1
          }
          mkdir -p artifacts/results artifacts/diagnostics
          python - <<'PY' > artifacts/scenarios.tsv
          import json
          import os
          from pathlib import Path

          rows = json.loads(
              Path(f"prepared/shards/{os.environ['SHARD']}.json").read_text(
                  encoding="utf-8"
              )
          )
          for local_index, row in enumerate(rows, start=1):
              fields = (
                  local_index,
                  len(rows),
                  row["scenario_id"],
                  row["pair"],
                  row["timeframe"],
                  row["window_set_id"],
                  row["phase"],
                  row["timerange"],
                  row["cost_profile_id"],
                  row["registry_path"],
                  row["cost_profile_dir"],
                  row["initial_capital"],
                  row["monthly_budget"],
                  row["contribution_day"],
                  row["weekly_day"],
                  row["campaign_id"],
              )
              print("\t".join(str(value) for value in fields))
          PY
          while IFS=$'\t' read -r \
            local_index shard_total scenario_id pair timeframe window_set \
            scenario_phase timerange cost_profile registry cost_profile_dir \
            initial_capital monthly_budget contribution_day weekly_day campaign_id
          do
            test "$scenario_phase" = "$PHASE"
            safe_pair=${pair//\//_}
            output="artifacts/results/${scenario_phase}/${cost_profile}/${safe_pair}/${window_set}/${timerange}"
            echo "[shard $SHARD][$local_index/$shard_total] $cost_profile | $timerange"
            python -m roundup_crypto_lab.passive_dca_frequency_scenario \
              --pair "$pair" \
              --timeframe "$timeframe" \
              --timerange "$timerange" \
              --registry "$registry" \
              --initial-capital "$initial_capital" \
              --monthly-budget "$monthly_budget" \
              --contribution-day "$contribution_day" \
              --weekly-day "$weekly_day" \
              --cost-profile "$cost_profile" \
              --cost-profile-dir "$cost_profile_dir" \
              --repository-commit "$GITHUB_SHA" \
              --campaign-id "$campaign_id" \
              --phase "$scenario_phase" \
              --window-set-id "$window_set" \
              --scenario-id "$scenario_id" \
              --output-dir "$output"
          done < artifacts/scenarios.tsv
      - name: Record shard status
        if: always()
        env:
          JOB_STATUS: '${{ job.status }}'
          PHASE: '${{ inputs.phase }}'
          SHARD: '${{ matrix.shard }}'
        run: |
          mkdir -p artifacts/diagnostics
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path(
              f"artifacts/diagnostics/shard-{os.environ['SHARD']}-status.json"
          ).write_text(
              json.dumps(
                  {
                      "schema_version": "passive-dca-frequency-shard-status/v1",
                      "phase": os.environ["PHASE"],
                      "shard": int(os.environ["SHARD"]),
                      "conclusion": os.environ["JOB_STATUS"],
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: '${{ inputs.artifact_name }}-${{ inputs.phase }}-shard-${{ matrix.shard }}-${{ github.run_id }}'
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

  aggregate:
    if: always() && needs.prepare.result == 'success'
    needs: [prepare, campaign]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: "bash -eo pipefail {0}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Download shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '${{ inputs.artifact_name }}-${{ inputs.phase }}-shard-*-${{ github.run_id }}'
          path: artifacts
          merge-multiple: true
      - name: Build phase-aggregated frequency reports
        if: needs.campaign.result == 'success'
        env:
          PHASE: '${{ inputs.phase }}'
          CAMPAIGN_PATH: '${{ inputs.campaign_path }}'
          POLICY_PATH: '${{ inputs.policy_path }}'
        run: |
          python -m roundup_crypto_lab.passive_dca_frequency_campaign aggregate \
            --campaign "$CAMPAIGN_PATH" \
            --registry config/passive-dca-frequency-strategies.json \
            --policy "$POLICY_PATH" \
            --cost-profile-dir config/execution-cost-profiles \
            --phase "$PHASE" \
            --results-dir artifacts/results \
            --repository-commit "$GITHUB_SHA" \
            --output-dir "artifacts/aggregate/$PHASE"
          python -m roundup_crypto_lab.passive_dca_frequency_analysis_cli \
            --campaign "$CAMPAIGN_PATH" \
            --registry config/passive-dca-frequency-strategies.json \
            --policy "$POLICY_PATH" \
            --phase "$PHASE" \
            --results-dir artifacts/results \
            --repository-commit "$GITHUB_SHA" \
            --output-dir "artifacts/aggregate/$PHASE"
          cat "artifacts/aggregate/$PHASE/job-summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Record campaign status
        if: always()
        env:
          CAMPAIGN_RESULT: '${{ needs.campaign.result }}'
          PHASE: '${{ inputs.phase }}'
        run: |
          mkdir -p artifacts/diagnostics
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path("artifacts/diagnostics/campaign-status.json").write_text(
              json.dumps(
                  {
                      "schema_version": "passive-dca-frequency-status/v1",
                      "phase": os.environ["PHASE"],
                      "conclusion": (
                          "success"
                          if os.environ["CAMPAIGN_RESULT"] == "success"
                          else "failure"
                      ),
                      "shard_result": os.environ["CAMPAIGN_RESULT"],
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: '${{ inputs.artifact_name }}-${{ inputs.phase }}-${{ github.run_id }}'
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
