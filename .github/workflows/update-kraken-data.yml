name: Update Kraken data
on:
  schedule: [{cron: '17 3 * * 1'}]
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: kraken-ohlcv-pipeline, cancel-in-progress: false}
env: {FREQTRADE_VERSION: '2026.6', FREQTRADE_COMMIT: b604e2fd70539f7f73d3c62c16ce0b155bbab319}
jobs:
  update:
    runs-on: ubuntu-latest
    defaults: {run: {shell: "bash -eo pipefail {0}"}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/cache/restore@v4
        id: restore
        with: {path: user_data/data/kraken, key: 'kraken-ohlcv-v1-update-${{ github.run_id }}', restore-keys: kraken-ohlcv-v1-}
      - name: Require a seed cache
        run: |
          test '${{ steps.restore.outputs.cache-hit }}' != '' || { echo 'No prepared cache: run Seed Kraken data first.'; exit 1; }
      - name: Install pinned tools
        run: |
          python -m pip install -e '.[dev]'
          git clone --depth 1 --branch "$FREQTRADE_VERSION" https://github.com/freqtrade/freqtrade.git .freqtrade-src
          test "$(git -C .freqtrade-src rev-parse HEAD)" = "$FREQTRADE_COMMIT"
          python -m pip install -r .freqtrade-src/requirements.txt
          python -m pip install --no-deps -e .freqtrade-src
          python -m pip install --no-deps -e .freqtrade-src/ft_client
          python -m pip check
      - name: Plan bounded weekly OHLCV update
        run: |
          mkdir -p artifacts/logs
          python -c 'from pathlib import Path; from roundup_crypto_lab.kraken_ohlcv import report_gaps; report_gaps(Path("user_data/data/kraken"))' | tee artifacts/gaps-before-update.txt
          set +e
          python -m roundup_crypto_lab.kraken_update_plan user_data/data/kraken --output artifacts/update-plan.json | tee artifacts/logs/update-plan.txt
          plan_status=${PIPESTATUS[0]}
          set -e
          cat artifacts/update-plan.json >> "$GITHUB_STEP_SUMMARY"
          if [ "$plan_status" -ne 0 ]; then
            reason=$(python -c 'import json; print(json.load(open("artifacts/update-plan.json"))["reason"])')
            echo "::error::$reason. Run Seed Kraken data instead of reconstructing trades in the weekly workflow."
            exit "$plan_status"
          fi
      - name: Download recent Kraken OHLCV overlap
        timeout-minutes: 20
        run: |
          mkdir -p tmp-kraken-ohlcv
          DAYS=$(python -c 'import json; plan=json.load(open("artifacts/update-plan.json")); assert plan["mode"] == "recent_overlap"; print(plan["days"])')
          echo "download request: --days $DAYS (direct OHLCV, no trade backfill)" | tee artifacts/update-request.txt
          freqtrade download-data --config user_data/config.json --datadir tmp-kraken-ohlcv --pairs BTC/EUR ETH/EUR --days "$DAYS" --timeframes 4h |& tee artifacts/logs/download.txt
          # Project merge code preserves seeded history; Freqtrade never writes the prepared cache directly.
          python -m roundup_crypto_lab.merge_kraken_data user_data/data/kraken tmp-kraken-ohlcv --repository-commit "$GITHUB_SHA" --freqtrade-version "$FREQTRADE_VERSION" --freqtrade-commit "$FREQTRADE_COMMIT" |& tee artifacts/logs/merge.txt
          python -c 'from pathlib import Path; from roundup_crypto_lab.kraken_ohlcv import common_timerange, load_and_verify_manifest; load_and_verify_manifest(Path("user_data/data/kraken")); print(common_timerange(Path("user_data/data/kraken")))' | tee artifacts/update-timerange.txt
          rm -rf tmp-kraken-ohlcv
      - uses: actions/cache/save@v4
        with: {path: user_data/data/kraken, key: 'kraken-ohlcv-v1-update-${{ github.run_id }}'}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 'kraken-update-reports-${{ github.run_id }}'
          path: |
            artifacts/
            user_data/data/kraken/kraken-ohlcv-manifest.json
          if-no-files-found: error
          retention-days: 30
