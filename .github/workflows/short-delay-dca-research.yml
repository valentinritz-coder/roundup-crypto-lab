name: Short-delay DCA research

'on':
  workflow_dispatch:
    inputs:
      campaign_path:
        description: Committed frozen short-delay campaign
        required: true
        default: config/short-delay-dca-campaign.json
        type: string
      research_section:
        description: Multi-window research or continuous historical complement
        required: true
        default: multi-window
        type: choice
        options: [multi-window, historical-complement]
      artifact_prefix:
        description: Artifact prefix
        required: true
        default: short-delay-dca-research
        type: string

permissions:
  contents: read

concurrency:
  group: 'short-delay-dca-research-${{ inputs.research_section }}'
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      shards: '${{ steps.plan.outputs.shards }}'
      scenario_count: '${{ steps.plan.outputs.scenario_count }}'
    defaults:
      run:
        shell: "bash -eo pipefail {0}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Validate frozen protocol and build deterministic shards
        id: plan
        env:
          CAMPAIGN_PATH: '${{ inputs.campaign_path }}'
          RESEARCH_SECTION: '${{ inputs.research_section }}'
        run: |
          test "$CAMPAIGN_PATH" = config/short-delay-dca-campaign.json
          test "$RESEARCH_SECTION" = multi-window \
            -o "$RESEARCH_SECTION" = historical-complement
          mkdir -p prepared/shards
          python -m roundup_crypto_lab.short_delay_campaign \
            --campaign "$CAMPAIGN_PATH" \
            validate \
            --output prepared/validation.json
          python -m roundup_crypto_lab.short_delay_campaign \
            --campaign "$CAMPAIGN_PATH" \
            plan \
            --section "$RESEARCH_SECTION" \
            --output prepared/plan.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          rows = json.loads(Path("prepared/plan.json").read_text(encoding="utf-8"))
          expected = 48 if os.environ["RESEARCH_SECTION"] == "multi-window" else 4
          if len(rows) != expected:
              raise SystemExit(f"unexpected scenario count: {len(rows)}; expected {expected}")
          requested = 12 if expected == 48 else 4
          shard_count = min(requested, len(rows))
          shards = [[] for _ in range(shard_count)]
          for index, row in enumerate(rows):
              shards[index % shard_count].append(row)
          for shard_index, shard_rows in enumerate(shards):
              Path(f"prepared/shards/{shard_index}.json").write_text(
                  json.dumps(shard_rows, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
          matrix = {"shard": list(range(shard_count))}
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"shards={json.dumps(matrix, separators=(',', ':'))}\n")
              output.write(f"scenario_count={len(rows)}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: '${{ inputs.artifact_prefix }}-plan-${{ github.run_id }}'
          path: prepared/
          if-no-files-found: error
          retention-days: 30

  research:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: '${{ fromJSON(needs.prepare.outputs.shards) }}'
    defaults:
      run:
        shell: "bash -eo pipefail {0}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Restore prepared Kraken cache
        id: restore-kraken
        uses: actions/cache/restore@v4
        with:
          path: user_data/data/kraken
          key: 'kraken-ohlcv-v1-short-delay-${{ github.run_id }}'
          restore-keys: kraken-ohlcv-v1-
      - name: Download campaign plan
        uses: actions/download-artifact@v4
        with:
          name: '${{ inputs.artifact_prefix }}-plan-${{ github.run_id }}'
          path: prepared
      - name: Run every scenario in shard
        env:
          SHARD: '${{ matrix.shard }}'
          CAMPAIGN_PATH: '${{ inputs.campaign_path }}'
        run: |
          test '${{ steps.restore-kraken.outputs.cache-hit }}' != '' || {
            echo 'No prepared Kraken cache was restored. Run Update Kraken data first.'
            exit 1
          }
          mkdir -p artifacts/results artifacts/diagnostics artifacts/scenarios
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          rows = json.loads(
              Path(f"prepared/shards/{os.environ['SHARD']}.json").read_text(
                  encoding="utf-8"
              )
          )
          for index, row in enumerate(rows):
              Path(f"artifacts/scenarios/{index}.json").write_text(
                  json.dumps(row, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
          PY
          failed=0
          for scenario_file in artifacts/scenarios/*.json
          do
            scenario_id=$(python -c \
              'import json,sys; print(json.load(open(sys.argv[1]))["scenario_id"])' \
              "$scenario_file")
            safe_id=$(printf '%s' "$scenario_id" | tr ':/' '__')
            output="artifacts/results/$safe_id"
            echo "[shard $SHARD] $scenario_id"
            if ! python -m roundup_crypto_lab.short_delay_campaign \
              --campaign "$CAMPAIGN_PATH" \
              run-scenario \
              --scenario "$scenario_file" \
              --repository-commit "$GITHUB_SHA" \
              --output-dir "$output"
            then
              echo "::error title=Short-delay scenario failed::$scenario_id"
              failed=1
            fi
          done
          exit "$failed"
      - name: Record shard status
        if: always()
        env:
          SHARD: '${{ matrix.shard }}'
          JOB_STATUS: '${{ job.status }}'
          RESEARCH_SECTION: '${{ inputs.research_section }}'
        run: |
          mkdir -p artifacts/diagnostics
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "schema_version": "short-delay-dca-shard-status/v1",
              "research_section": os.environ["RESEARCH_SECTION"],
              "shard": int(os.environ["SHARD"]),
              "conclusion": os.environ["JOB_STATUS"],
          }
          Path(f"artifacts/diagnostics/shard-{os.environ['SHARD']}.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: >-
            ${{ inputs.artifact_prefix }}-${{ inputs.research_section }}-shard-${{
            matrix.shard }}-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

  aggregate:
    if: always() && needs.prepare.result == 'success'
    needs: [prepare, research]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: "bash -eo pipefail {0}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Download shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: >-
            ${{ inputs.artifact_prefix }}-${{ inputs.research_section }}-shard-*-\
            ${{ github.run_id }}
          path: artifacts
          merge-multiple: true
      - name: Aggregate only a complete successful matrix
        if: needs.research.result == 'success'
        env:
          CAMPAIGN_PATH: '${{ inputs.campaign_path }}'
          RESEARCH_SECTION: '${{ inputs.research_section }}'
        run: |
          python -m roundup_crypto_lab.short_delay_campaign \
            --campaign "$CAMPAIGN_PATH" \
            aggregate \
            --section "$RESEARCH_SECTION" \
            --results-dir artifacts/results \
            --repository-commit "$GITHUB_SHA" \
            --output-dir "artifacts/final/$RESEARCH_SECTION"
          cat "artifacts/final/$RESEARCH_SECTION/job-summary.md" \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Block aggregate after any failed shard
        if: needs.research.result != 'success'
        run: |
          mkdir -p artifacts/final
          printf '%s\n' \
            '{"matrix_complete":false,"ranking_allowed":false}' \
            > artifacts/final/incomplete-matrix-status.json
          echo 'Short-delay campaign incomplete; final aggregation and ranking blocked.' \
            >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: >-
            ${{ inputs.artifact_prefix }}-${{ inputs.research_section }}-${{
            github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
