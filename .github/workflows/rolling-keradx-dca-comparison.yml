name: Rolling KerADX DCA comparison

on:
  workflow_dispatch:
    inputs:
      pair:
        description: Supported single pair
        required: true
        default: BTC/EUR
        type: choice
        options: [BTC/EUR, ETH/EUR]
      start_date:
        description: First rolling-window start, YYYY-MM-DD
        required: true
        default: '2018-04-05'
        type: string
      end_date:
        description: Exclusive campaign end, YYYY-MM-DD
        required: true
        default: '2026-04-01'
        type: string
      window_months:
        description: Complete window length in months
        required: true
        default: '24'
        type: string
      step_months:
        description: Months between window starts
        required: true
        default: '3'
        type: string
      initial_capital:
        description: Initial investor capital
        required: true
        default: '40'
        type: string
      monthly_budget:
        description: Monthly investor budget
        required: true
        default: '40'
        type: string
      contribution_day:
        description: Monthly contribution day
        required: true
        default: '1'
        type: string
      fee_ratio:
        description: Trading fee ratio
        required: true
        default: '0.0026'
        type: string

permissions: {contents: read}

concurrency:
  group: rolling-keradx-dca-${{ inputs.pair }}-${{ github.run_id }}
  cancel-in-progress: false

env:
  PAIR: ${{ inputs.pair }}
  INITIAL_CAPITAL: ${{ inputs.initial_capital }}
  MONTHLY_BUDGET: ${{ inputs.monthly_budget }}
  CONTRIBUTION_DAY: ${{ inputs.contribution_day }}
  FEE: ${{ inputs.fee_ratio }}
  TIMEFRAME: 4h

jobs:
  compare-rolling-windows:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Restore Kraken cache
        uses: actions/cache/restore@v4
        id: restore-kraken
        with:
          path: user_data/data/kraken
          key: kraken-ohlcv-v1-update-${{ github.run_id }}
          restore-keys: kraken-ohlcv-v1-
      - name: Generate complete rolling windows
        run: |
          test '${{ steps.restore-kraken.outputs.cache-hit }}' != '' || { echo 'No Kraken cache was restored: run Update Kraken data first.'; exit 1; }
          python -c 'from roundup_crypto_lab.investment_plan import InvestmentPlan; import os; day=float(os.environ["CONTRIBUTION_DAY"]); assert day.is_integer(); InvestmentPlan(os.environ["INITIAL_CAPITAL"], os.environ["MONTHLY_BUDGET"], os.environ["FEE"], int(day))'
          python -m roundup_crypto_lab.rolling_keradx_dca generate \
            --start-date '${{ inputs.start_date }}' \
            --end-date '${{ inputs.end_date }}' \
            --window-months '${{ inputs.window_months }}' \
            --step-months '${{ inputs.step_months }}' \
            --output artifacts/windows.json
          python -c 'from pathlib import Path; from roundup_crypto_lab.freqtrade_differential import generate_single_pair_config; import os; generate_single_pair_config(Path("user_data/config.json"), Path("artifacts/pair-config.json"), os.environ["PAIR"], overrides={"dry_run_wallet": int(float(os.environ["INITIAL_CAPITAL"])), "fee": float(os.environ["FEE"])})'
      - name: Compare KerADX with DCA in every window
        run: |
          python - <<'PY' > artifacts/windows.tsv
          import json
          for window in json.load(open('artifacts/windows.json')):
              print(window['window_id'], window['timerange'], sep='\t')
          PY
          while IFS=$'\t' read -r window_id timerange; do
            out="artifacts/windows/$window_id"
            mkdir -p "$out"
            python -m roundup_crypto_lab.breakout_comparison validate-data "$timerange" user_data/data/kraken |& tee "$out/data-validation.txt"
            python -m roundup_crypto_lab.freqtrade_active \
              --data-file "user_data/data/kraken/${PAIR//\//_}-4h.feather" \
              --pair "$PAIR" \
              --strategy RoundupTrendQualityKerAdxStrategy \
              --timerange "$timerange" \
              --capital-mode recurring_monthly_contributions \
              --initial-capital "$INITIAL_CAPITAL" \
              --monthly-budget "$MONTHLY_BUDGET" \
              --contribution-day "$(python -c 'import os; print(int(float(os.environ["CONTRIBUTION_DAY"])))')" \
              --fee "$FEE" \
              --config-file artifacts/pair-config.json \
              --output "$out/active-keradx.json"
            python -m roundup_crypto_lab.scenario_passive \
              --data-dir user_data/data/kraken \
              --pair "$PAIR" \
              --timeframe "$TIMEFRAME" \
              --timerange "$timerange" \
              --capital-mode recurring_monthly_contributions \
              --initial-capital "$INITIAL_CAPITAL" \
              --monthly-budget "$MONTHLY_BUDGET" \
              --contribution-day "$(python -c 'import os; print(int(float(os.environ["CONTRIBUTION_DAY"])))')" \
              --fee "$FEE" \
              --repository-commit "$GITHUB_SHA" \
              --output "$out/scenario-passive.json"
          done < artifacts/windows.tsv
      - name: Aggregate comparison
        run: |
          python -m roundup_crypto_lab.rolling_keradx_dca aggregate \
            --window-dir artifacts/windows \
            --output-json artifacts/rolling-comparison.json \
            --output-csv artifacts/rolling-comparison.csv \
            --summary artifacts/rolling-summary.md
          cat artifacts/rolling-summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: rolling-keradx-dca-${{ github.run_id }}
          path: artifacts/
          retention-days: 30
