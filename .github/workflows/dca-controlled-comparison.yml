name: Controlled DCA strategy comparison
on:
  workflow_dispatch:
    inputs:
      pair: {description: Separate market scenario, required: true, default: "BTC/EUR", type: choice, options: ["BTC/EUR", "ETH/EUR"]}
      timeframe: {description: Prepared Kraken timeframe, required: true, default: "4h", type: choice, options: ["4h"]}
      timerange: {description: Strict YYYYMMDD-YYYYMMDD range, required: true, type: string}
      registry_path: {description: Reviewed registry path, required: true, default: "config/dca-strategy-registry.json", type: string}
      initial_capital: {description: Initial capital, required: true, default: "40", type: string}
      monthly_budget: {description: Monthly contribution, required: true, default: "40", type: string}
      contribution_day: {description: Monthly contribution day (integer 1-31), required: true, default: "1", type: string}
      fee_ratio: {description: Trading fee ratio, required: true, default: "0.0026", type: string}
      artifact_name: {description: Artifact prefix, required: true, default: "controlled-dca-comparison", type: string}
permissions: {contents: read}
concurrency:
  group: 'controlled-dca-${{ inputs.pair }}-${{ github.run_id }}'
  cancel-in-progress: false
jobs:
  compare-dca-strategies:
    runs-on: ubuntu-latest
    defaults: {run: {shell: "bash -eo pipefail {0}"}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: pyproject.toml}
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Normalize workflow inputs
        env:
          RAW_PAIR: '${{ inputs.pair }}'
          RAW_TIMEFRAME: '${{ inputs.timeframe }}'
          RAW_TIMERANGE: '${{ inputs.timerange }}'
          RAW_REGISTRY_PATH: '${{ inputs.registry_path }}'
          RAW_INITIAL_CAPITAL: '${{ inputs.initial_capital }}'
          RAW_MONTHLY_BUDGET: '${{ inputs.monthly_budget }}'
          RAW_CONTRIBUTION_DAY: '${{ inputs.contribution_day }}'
          RAW_FEE_RATIO: '${{ inputs.fee_ratio }}'
        run: |
          python - <<'PY'
          import os
          from decimal import Decimal, InvalidOperation
          from pathlib import Path

          names = (
              "PAIR",
              "TIMEFRAME",
              "TIMERANGE",
              "REGISTRY_PATH",
              "INITIAL_CAPITAL",
              "MONTHLY_BUDGET",
              "CONTRIBUTION_DAY",
              "FEE_RATIO",
          )
          values = {}
          for name in names:
              value = os.environ[f"RAW_{name}"].strip()
              if not value or "\n" in value or "\r" in value:
                  raise ValueError(f"invalid workflow input: {name}")
              values[name] = value

          try:
              contribution_day = Decimal(values["CONTRIBUTION_DAY"])
          except InvalidOperation as exc:
              raise ValueError("contribution day must be an integer from 1 through 31") from exc
          if (
              not contribution_day.is_finite()
              or contribution_day != contribution_day.to_integral_value()
              or not 1 <= contribution_day <= 31
          ):
              raise ValueError("contribution day must be an integer from 1 through 31")
          values["CONTRIBUTION_DAY"] = str(int(contribution_day))

          destination = Path(os.environ["GITHUB_ENV"])
          with destination.open("a", encoding="utf-8") as handle:
              for name in names:
                  handle.write(f"{name}={values[name]}\n")
          PY
      - name: Restore prepared Kraken cache
        id: restore-kraken
        uses: actions/cache/restore@v4
        with:
          path: user_data/data/kraken
          key: 'kraken-ohlcv-v1-controlled-dca-${{ github.run_id }}'
          restore-keys: kraken-ohlcv-v1-
      - name: Validate immutable inputs and registry
        run: |
          test '${{ steps.restore-kraken.outputs.cache-hit }}' != '' || { echo 'No prepared Kraken cache was restored. Run Update Kraken data first.'; exit 1; }
          test "$REGISTRY_PATH" = config/dca-strategy-registry.json
          python -m roundup_crypto_lab.breakout_comparison validate-timerange "$TIMERANGE"
          python -m roundup_crypto_lab.dca_registry "$REGISTRY_PATH" --output artifacts/validated-registry.json
          python -m roundup_crypto_lab.breakout_comparison validate-data "$TIMERANGE" user_data/data/kraken |& tee artifacts/data-validation.txt
          test -f "user_data/data/kraken/${PAIR//\//_}-${TIMEFRAME}.feather"
      - name: Run controlled DCA comparison
        run: |
          python -m roundup_crypto_lab.dca_controlled_comparison \
            --pair "$PAIR" --timeframe "$TIMEFRAME" --timerange "$TIMERANGE" \
            --registry "$REGISTRY_PATH" --initial-capital "$INITIAL_CAPITAL" \
            --monthly-budget "$MONTHLY_BUDGET" --contribution-day "$CONTRIBUTION_DAY" \
            --fee "$FEE_RATIO" --repository-commit "$GITHUB_SHA" \
            --output-dir artifacts/results
          cat artifacts/results/job-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Record scenario status
        if: always()
        env: {JOB_STATUS: '${{ job.status }}'}
        run: |
          mkdir -p artifacts
          python -c 'import json, os, pathlib; pathlib.Path("artifacts/scenario-status.json").write_text(json.dumps({"schema_version":"dca-controlled-comparison-status/v1","pair":os.environ.get("PAIR", ""),"timerange":os.environ.get("TIMERANGE", ""),"conclusion":os.environ["JOB_STATUS"]}, indent=2, sort_keys=True)+"\n")'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: '${{ inputs.artifact_name }}-${{ github.run_id }}'
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
